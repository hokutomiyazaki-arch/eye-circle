<script type="module">

// 目の大きさ（目じり〜目がしらの長さ）を、映像の短い辺で割った値。スマホを顔に近づけるほど大きくなる

const EYE_OK = [0.13, 0.20];   // 目のチェックで「OK」とする目の大きさ（仮。宮崎さんの端末の記録で詰める）

let camWanted = false, camErr = '';   // 一度つけたら、このページを閉じるまでカメラを保つ

async function record(ms, onTick) {

async function gate() {

function validHistory(d){const num=Number.isFinite,nullable=x=>x===null||num(x),row=r=>r&&names.includes(r.name)&&['reach','lag','error'].every(k=>nullable(r[k]))&&Number.isInteger(r.jumps)&&r.jumps>=0&&Number.isInteger(r.frames)&&r.frames>=0;return d?.v===3&&num(Date.parse(d.date))&&typeof d.demo==='boolean'&&typeof d.hard==='string'&&num(d.period)&&d.period>0&&num(d.faceRatio)&&num(d.fps)&&Array.isArray(d.trace)&&d.trace.every(r=>r&&typeof r.valid==='boolean'&&['cw','ccw'].includes(r.direction)&&(!r.valid||(num(r.x)&&num(r.y)&&Number.isInteger(r.segment))))&&Array.isArray(d.events)&&d.events.every(e=>e&&[e.start,e.end].every(r=>r&&num(r.x)&&num(r.y)))&&Array.isArray(d.quality)&&d.quality.every(q=>q&&typeof q.unread==='boolean'&&['cw','ccw'].includes(q.direction))&&['cw','ccw','all'].every(k=>Array.isArray(d.groups?.[k])&&d.groups[k].length===8&&d.groups[k].every(row));}
try{const a=JSON.parse(localStorage.getItem('eye-circle-history-v3')||'[]');history=Array.isArray(a)?a.filter(validHistory).slice(0,20):[];}catch{history=[];}renderHistory();
const note=document.createElement('p');note.className='muted';note.textContent='届きは全体の振れ幅を1にそろえた値です。「届いていない」は、ほかの向きより届いていないという意味です。遅れ°は、その周全体より遅れる角度です（＋が遅れ）。届きが赤いのは0.8未満＝届いていない向きです。左右は本人から見た向きです。';$('tables').before(note);
expose();
if(demo){$('bStart').disabled=false;$('loadState').textContent='デモの準備ができました（合成データ）';}else import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/vision_bundle.mjs').then(m=>{FilesetResolver=m.FilesetResolver;FaceLandmarker=m.FaceLandmarker;return load();}).catch(e=>{$('loadState').textContent='読み込みに失敗しました：'+e.message;});
if(!demo&&!test&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
