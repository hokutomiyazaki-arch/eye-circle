<main id="home"><h1>目の円トレース</h1><p>頭を動かさず、目だけで点を追ってください。<br>PCかタブレットだとよく読めます。顔を画面から40〜50cm離してください。<br>明るい部屋で、眼鏡の反射に注意してください。</p><label>1周の秒数 <select id="seconds"><option>6</option><option selected>8</option><option>12</option></select></label><p>右回り2周 → 左回り2周</p><button id="start" class="primary" disabled>始める</button><button id="fullscreen">全画面</button><p id="loadState" role="status">読み込み中… 0%</p><p id="orientation">横にすると円が大きくなります</p><h2>前回の結果</h2><div id="history"></div><p class="muted">これは医療の検査ではありません。カメラの映像は端末の中だけで処理し、送信しません。</p></main>

addEventListener('resize',resize);resize();

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function calibrate(){const t=++token;phase='calibration';$('align').hidden=true;const samples=[];try{for(let i=0;i<10;i++){const key=i===9?0:i,angle=-(i-1)*TAU/8;point=key?{x:Math.cos(angle),y:Math.sin(angle)}:{x:0,y:0};let frames;for(let attempt=0;attempt<=2;attempt++){$('cue').textContent=attempt?'有効なコマが足りません。同じ点をもう一度見てください':'点を目だけで見てください';drawField();await sleep(700);if(t!==token)return;frames=[];collect=frames;await sleep(1000);collect=null;if(t!==token)return;if(frames.length>=10)break;}if(frames.length<10)throw Error('有効なコマが足りません。顔の位置と明るさを確認してください。');if(key===0&&i===0)baseline.ap=med(frames.map(f=>f[5]));samples.push({key,...point,f:Array.from({length:6},(_,j)=>med(frames.map(f=>f[j])))});}cal=fit(samples);window.__ec.calibration=cal;point=null;drawField();phase='review';$('cue').textContent=`当てはまりの悪さ：${cal.error.toFixed(2)}${cal.error>.25?'。もう一度合わせることをおすすめします。':''}`;$('align').hidden=false;$('align').replaceChildren();const retry=document.createElement('button');retry.textContent='もう一度合わせる';retry.onclick=calibrate;const next=document.createElement('button');next.textContent='このまま進む';next.className='primary';next.onclick=startRun;$('align').append(retry,next);}catch(e){collect=null;point=null;drawField();$('cue').textContent=e.message;$('align').hidden=false;$('align').replaceChildren();const b=document.createElement('button');b.textContent='合わせをやり直す';b.onclick=calibrate;$('align').append(b);}}
async function startRun(){if(!demo&&!cal)return;const t=++token;show('stage');$('align').hidden=true;$('preview').hidden=demo;rows=[];window.__ec.records=rows;period=Number($('seconds').value);phase='countdown';point={x:1,y:0};$('cue').textContent='頭を動かさず、目だけで点を追ってください';drawField(true);for(const n of [3,2,1]){$('count').textContent=n;await sleep(1000);if(t!==token)return;}$('count').textContent='';runStart=performance.now();phase='running';}

function renderHistory(){const h=$('history');h.replaceChildren();if(!history.length){h.textContent='まだ記録はありません';return;}for(const d of history){const b=document.createElement('button');b.textContent=`${new Date(d.date).toLocaleString('ja-JP')} ${d.demo?'［デモ］ ':''}${d.hard}`;b.onclick=()=>renderResult(d);h.append(b);}}
function cancel(){token++;phase='home';collect=null;point=null;$('count').textContent='';show('home');$('preview').hidden=true;}
async function begin(){try{if(demo){await startRun();return;}if(!stream?.getVideoTracks().length||!stream.getVideoTracks().every(t=>t.readyState==='live')){stream?.getTracks().forEach(t=>t.stop());latest=null;lastVideo=-1;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});$('video').srcObject=stream;await $('video').play();}show('stage');$('preview').hidden=false;$('align').hidden=false;$('align').innerHTML='<button id="aligned" class="primary" disabled>顔と両目を映してください</button>';$('aligned').onclick=()=>{if(!latest||blinking(latest))return;baseline={nose:{...latest.nose},distance:latest.distance,pose:latest.pose,ap:null};calibrate();};phase='align';point=null;drawField();$('cue').textContent='頭を動かさず、顔と両目を映してください';}catch(e){$('loadState').textContent='カメラを開始できません：'+e.message;}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('start').onclick=begin;$('stop').onclick=cancel;$('back').onclick=cancel;$('again').onclick=startRun;$('recalibrate').onclick=begin;$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen();}catch{$('loadState').textContent='この端末では全画面にできません';}};
$('png').onclick=()=>$('resultCanvas').toBlob(b=>{if(b)download(b,'eye-circle.png');});$('csv').onclick=()=>{const keys=['t','direction','angle','targetX','targetY','X','Y','blink','head','headMoved','missing'];download(new Blob(['\uFEFF'+keys.join(',')+'\n'+rows.map(r=>keys.map(k=>r[k]??'').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'eye-circle.csv');};
async function load(){if(demo){$('loadState').textContent='デモの準備ができました（カメラなし・合成データ）';$('start').disabled=false;return;}const [{FilesetResolver,FaceLandmarker},model]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/vision_bundle.mjs'),(async()=>{const r=await fetch(MODEL);if(!r.ok)throw Error('モデルの取得に失敗しました');const total=Number(r.headers.get('content-length')),reader=r.body?.getReader();if(!reader)return new Uint8Array(await r.arrayBuffer());let got=0;const chunks=[];for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;$('loadState').textContent=total?`モデル読み込み中… ${Math.min(99,Math.round(got/total*100))}%`:'モデル読み込み中…（取得サイズを確認中）';}const buffer=new Uint8Array(got);let offset=0;for(const c of chunks){buffer.set(c,offset);offset+=c.length;}return buffer;})()]);$('loadState').textContent='モデル読み込み 100%・顔の読み取りを準備中';const fs=await FilesetResolver.forVisionTasks(WASM),options=delegate=>({baseOptions:{modelAssetBuffer:model,delegate},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true});try{lm=await FaceLandmarker.createFromOptions(fs,options('GPU'));}catch{lm=await FaceLandmarker.createFromOptions(fs,options('CPU'));}$('loadState').textContent='準備ができました';$('start').disabled=false;}
function validHistory(d){const finite=Number.isFinite,nullable=v=>v===null||finite(v),trace=r=>r&&typeof r.valid==='boolean'&&['cw','ccw'].includes(r.direction)&&(!r.valid||(finite(r.x)&&finite(r.y)&&Number.isInteger(r.segment))),row=r=>r&&names.includes(r.name)&&['reach','lag','error'].every(k=>nullable(r[k]))&&Number.isInteger(r.jumps)&&r.jumps>=0&&Number.isInteger(r.frames)&&r.frames>=0;return !!d&&typeof d.date==='string'&&finite(Date.parse(d.date))&&typeof d.demo==='boolean'&&finite(d.period)&&d.period>0&&typeof d.hard==='string'&&finite(d.headRatio)&&d.headRatio>=0&&d.headRatio<=1&&Number.isInteger(d.validCount)&&d.validCount>=0&&(d.calibration===null||finite(d.calibration?.error))&&['cw','ccw','all'].every(k=>Array.isArray(d.groups?.[k])&&d.groups[k].length===names.length&&d.groups[k].every(row))&&Array.isArray(d.trace)&&d.trace.every(trace)&&Array.isArray(d.events)&&d.events.every(e=>e&&trace(e.start)&&trace(e.end)&&e.start.segment===e.end.segment);}
try{history=JSON.parse(localStorage.getItem('eye-circle-history')||'[]');history=Array.isArray(history)?history.filter(validHistory):[];renderHistory();}catch{history=[];}load().catch(e=>{$('loadState').textContent='読み込みに失敗しました：'+e.message;});
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;latest=null;lastVideo=-1;});
</script></body></html>
